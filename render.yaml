services:
  - type: web
    name: railway-eureka-server
    runtime: docker
    plan: free
    dockerfilePath: Train/eureka-server/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: EUREKA_HOSTNAME
        value: railway-eureka-server

  - type: web
    name: railway-config-server
    runtime: docker
    plan: free
    dockerfilePath: Train/config-server/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8888
      - key: CONFIG_REPOSITORY_LOCATION
        value: file:/app/config-repository
      - key: EUREKA_DEFAULT_ZONE
        value: "http://railway-eureka-server:10000/eureka"

  - type: web
    name: railway-user-service
    runtime: docker
    plan: free
    dockerfilePath: Train/user-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: CONFIG_SERVER_URL
        value: "http://railway-config-server:8888"
      - key: EUREKA_DEFAULT_ZONE
        value: "http://railway-eureka-server:10000/eureka"
      - key: USERSERVICE_DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  - type: web
    name: railway-train-service
    runtime: docker
    plan: free
    dockerfilePath: Train/train-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: CONFIG_SERVER_URL
        value: "http://railway-config-server:8888"
      - key: EUREKA_DEFAULT_ZONE
        value: "http://railway-eureka-server:10000/eureka"
      - key: TRAINSERVICE_DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  - type: web
    name: railway-payment-service
    runtime: docker
    plan: free
    dockerfilePath: Train/payment-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: CONFIG_SERVER_URL
        value: "http://railway-config-server:8888"
      - key: EUREKA_DEFAULT_ZONE
        value: "http://railway-eureka-server:10000/eureka"
      - key: PAYMENTSERVICE_DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYMENT_GATEWAY
        value: mock
      - key: PAYMENT_SUCCESS_URL
        value: "https://railway-frontend.onrender.com/payment-success"
      - key: PAYMENT_CANCEL_URL
        value: "https://railway-frontend.onrender.com/dashboard"
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_SSL_TRUST
        value: smtp.gmail.com
      - key: MAIL_TEST_CONNECTION
        value: true

  - type: web
    name: railway-reservation-service
    runtime: docker
    plan: free
    dockerfilePath: Train/reservation-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: CONFIG_SERVER_URL
        value: "http://railway-config-server:8888"
      - key: EUREKA_DEFAULT_ZONE
        value: "http://railway-eureka-server:10000/eureka"
      - key: RESERVATIONSERVICE_DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  - type: web
    name: railway-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: Train/api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: EUREKA_DEFAULT_ZONE
        value: "http://railway-eureka-server:10000/eureka"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://railway-frontend.onrender.com"

  - type: web
    name: railway-frontend
    runtime: static
    rootDir: railway-frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://railway-api-gateway.onrender.com"
